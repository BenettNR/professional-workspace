name: rag-hybrid-search CI

on:
  push:
    branches: [main]
    paths:
      - 'rag-hybrid-search/**'
      - '.github/workflows/rag-ci.yml'
  pull_request:
    paths:
      - 'rag-hybrid-search/**'
      - '.github/workflows/rag-ci.yml'

defaults:
  run:
    working-directory: rag-hybrid-search

concurrency:
  # One run per branch; new pushes cancel in-flight runs.
  group: rag-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - run: mypy --strict src/

  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      # Offline backends — CI never touches Voyage or Anthropic and never
      # downloads the all-MiniLM model weights either (tests mock them).
      EMBEDDING_BACKEND: local
      LLM_BACKEND: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=src \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=45 \
            --deselect tests/test_ingestion.py::TestFixedSizeChunker::test_splits_long_text \
            -q
      - name: Upload coverage XML
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: rag-hybrid-search/coverage.xml
          retention-days: 14

  docker-build:
    name: docker compose build + health check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build API + frontend images
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml build
      - name: Start stack (offline mode)
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
      - name: Wait for /health (60s budget)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "API healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy in 60s"
          docker compose -f docker-compose.yml -f docker-compose.demo.yml logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v
