[project]
name = "rag-hybrid-search"
version = "0.1.0"
description = "Production-grade RAG pipeline with hybrid dense+sparse retrieval and citation verification"
requires-python = ">=3.11"
dependencies = [
    # LLM + embeddings (full Anthropic suite)
    "anthropic>=0.40.0",
    "voyageai>=0.3.0",
    # Vector store
    "chromadb>=0.5.0",
    # Sparse retrieval
    "rank-bm25>=0.2.2",
    # Chunking
    "langchain-text-splitters>=0.3.0",
    # Reranking (cross-encoder)
    "sentence-transformers>=3.0.0",
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    # Config & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Document parsing
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    # Numerics
    "numpy>=1.26.0",
    # Structured logging
    "structlog>=24.4.0",
    # Frontend
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    # HTTP client (frontend → API calls)
    "httpx>=0.27.0",
    # Resilience
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-aiofiles>=24.1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing -q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
