# Run `pre-commit install` once to enable hooks on `git commit`.
# Match CI's gates so failures show up locally before they fail in CI.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        # Strict mode on src/ only — tests and scripts allowed to be looser.
        files: ^rag-hybrid-search/src/
        args: [--strict, --config-file=rag-hybrid-search/pyproject.toml]
        additional_dependencies:
          - pydantic>=2.9.0
          - pydantic-settings>=2.5.0
          - types-aiofiles>=24.1.0
