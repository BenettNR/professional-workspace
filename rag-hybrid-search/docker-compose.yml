# Live mode: requires .env with real Voyage + Anthropic keys for the API.
# Offline-mode demo overlays this with docker-compose.demo.yml, which sets
# EMBEDDING_BACKEND=local and LLM_BACKEND=replay and clears the keys.
#
# The `env_file` entry below is marked `required: false` so CI (which has
# no .env) can run the docker-build smoke test on the demo overlay only.
# In real live-mode deploys, `cp .env.example .env` first.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist indexes between container restarts
      - ./data:/app/data
    environment:
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      BM25_INDEX_PATH: /app/data/bm25_index.pkl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
